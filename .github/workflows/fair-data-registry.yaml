name: FAIR Data Registry
on: 
  push:
    branches:
      '**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # Run Every Monday at 9AM

jobs:
  test:
    name: Test ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.x']
    steps:
      - uses: actions/checkout@v7
      - run: git fetch --prune --unshallow
      - name: setup-python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install graphviz on ubuntu
        run:  |
              if [ ${{ runner.os }} == "Linux" ]; then
                  sudo apt-get install graphviz
              else
                  brew install graphviz
              fi
      - name: Run Tests
        run: |
          python -m pip install -r requirements.txt
          DJANGO_SETTINGS_MODULE=drams.test-settings coverage run --omit=drams,scripts,tools manage.py test 
      - name: Generate XML
        run: coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          env_vars: OS,PYTHON
          files: ./coverage.xml
          flags: unittests
          verbose: true
  deploy-local-registry:
    name: Deploy local registry on ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.x']
    env:
      REGISTRY_PORT: 8001
      INSTALL_DIR: fair
    steps:
      - name: setup-python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Deploy registry
        if: startsWith(github.ref, 'refs/tags/') != true
        run: curl -fsSL https://raw.githubusercontent.com/FAIRDataPipeline/data-registry/${GITHUB_REF/refs\/heads\//}/static/localregistry.sh | bash -s -- -d $INSTALL_DIR -b ${GITHUB_REF/refs\/heads\//}
      - name: Deploy registry (Tagged Release)
        if: startsWith(github.ref, 'refs/tags/')
        run: curl -fsSL https://raw.githubusercontent.com/FAIRDataPipeline/data-registry/${GITHUB_REF/refs\/tags\//}/static/localregistry.sh | bash -s -- -d $INSTALL_DIR -t ${GITHUB_REF/refs\/tags\//}
      - name: Start registry
        run:  |
              $INSTALL_DIR/registry/scripts/start_fair_registry -p $REGISTRY_PORT
      - name: Test registry
        run: curl http://localhost:$REGISTRY_PORT/api/
      - name: Test registry scripts
        run: |
          scripts=$INSTALL_DIR/registry/scripts
          # Wait up to 30 s for port $1 to answer ($2 = up) or to stop answering ($2 = down)
          wait_for() {
            for i in $(seq 30); do
              if curl -sf -m 5 -o /dev/null http://localhost:$1/api/; then
                [ $2 = up ] && return 0
              else
                [ $2 = down ] && return 0
              fi
              sleep 1
            done
            return 1
          }
          # -h prints usage rather than starting a server, and a bad option is refused
          $scripts/start_fair_registry -h | grep -q "^start_fair_registry \["
          ! $scripts/start_fair_registry -d 5 || exit 1
          # -p stops only that server, and no option (as the CLI calls it) stops the rest
          $scripts/start_fair_registry -p 8002
          wait_for 8002 up
          ! $scripts/stop_fair_registry -P 8002 || exit 1
          $scripts/stop_fair_registry -p 8002
          wait_for 8002 down
          wait_for $REGISTRY_PORT up
          $scripts/stop_fair_registry ""
          wait_for $REGISTRY_PORT down
  deploy-local-registry-windows:
    name: Deploy Local Registry on Windows
    runs-on: windows-latest
    env:
      REGISTRY_PORT: 8001
      INSTALL_DIR: fair
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CURL
        run: | 
          choco install curl
          choco install wget
      - name: Branch name
        id: branch_name
        run: |
          echo "SOURCE_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
          echo "SOURCE_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash
      - name: Deploy registry
        if: startsWith(github.ref, 'refs/tags/') != true
        shell: cmd
        run: |
          wget https://raw.githubusercontent.com/FAIRDataPipeline/data-registry/%SOURCE_BRANCH%/static/localregistry.bat
          localregistry.bat -d %INSTALL_DIR% -b %SOURCE_BRANCH%
        env:
          SOURCE_BRANCH: ${{ steps.branch_name.outputs.SOURCE_BRANCH }}
      - name: Deploy registry (Tagged Release)
        if: startsWith(github.ref, 'refs/tags/')
        shell: cmd
        run: |
          wget https://raw.githubusercontent.com/FAIRDataPipeline/data-registry/%SOURCE_TAG%/static/localregistry.bat
          localregistry.bat -d %INSTALL_DIR% -t %SOURCE_TAG%
        env:
          SOURCE_TAG: ${{ steps.branch_name.outputs.SOURCE_TAG }}
      - name: Start registry and test
        shell: cmd
        run:  |
            start /wait /b %INSTALL_DIR%\scripts\start_fair_registry_windows.bat -p %REGISTRY_PORT% -a 127.0.0.1 -b
            curl http://127.0.0.1:%REGISTRY_PORT%/api/
      - name: Test registry scripts
        shell: cmd
        run: |
          set SCRIPTS=%INSTALL_DIR%\scripts
          rem -h prints usage rather than starting a server
          call %SCRIPTS%\start_fair_registry_windows.bat -h | findstr /b /c:"Usage" || exit /b 1
          rem A bad option, or a port this install has no server on, stops nothing
          call %SCRIPTS%\stop_fair_registry_windows.bat -P %REGISTRY_PORT% && exit /b 1
          call %SCRIPTS%\stop_fair_registry_windows.bat -p 8002 || exit /b 1
          ping -n 4 127.0.0.1 >NUL
          curl -sf http://127.0.0.1:%REGISTRY_PORT%/api/ >NUL || exit /b 1
          rem -p stops the server on that port
          call %SCRIPTS%\stop_fair_registry_windows.bat -p %REGISTRY_PORT% || exit /b 1
          ping -n 4 127.0.0.1 >NUL
          curl -sf http://127.0.0.1:%REGISTRY_PORT%/api/ >NUL && exit /b 1
          rem No option, as the CLI calls it, stops this install's servers and not another
          rem install's. The second server needs its own install: on Windows two servers
          rem cannot share an install's output.log.
          xcopy %INSTALL_DIR% fair2 /E /I /Q /H /Y >NUL || exit /b 1
          start /wait /b %SCRIPTS%\start_fair_registry_windows.bat -p %REGISTRY_PORT% -a 127.0.0.1 -b
          start /wait /b fair2\scripts\start_fair_registry_windows.bat -p 8002 -a 127.0.0.1 -b
          curl -sf http://127.0.0.1:%REGISTRY_PORT%/api/ >NUL || exit /b 1
          curl -sf http://127.0.0.1:8002/api/ >NUL || exit /b 1
          call %SCRIPTS%\stop_fair_registry_windows.bat ""
          ping -n 4 127.0.0.1 >NUL
          curl -sf http://127.0.0.1:%REGISTRY_PORT%/api/ >NUL && exit /b 1
          curl -sf http://127.0.0.1:8002/api/ >NUL || exit /b 1
          call fair2\scripts\stop_fair_registry_windows.bat ""
          ping -n 4 127.0.0.1 >NUL
          curl -sf http://127.0.0.1:8002/api/ >NUL && exit /b 1
          exit /b 0

